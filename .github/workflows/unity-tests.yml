# Unity のコンパイルと EditMode テストを実行する（改善プラン P4）
# - Secret（UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD）が未登録のときは、失敗させずにスキップする
# - 有料アセット（ParticlePack / CleanFlatIcon）は git に含まれないので、CI はそれらが無い状態で実行する
#   （自作コードはこれらに依存していない）。CI 上に有料アセットを置いたり、キャッシュや成果物に含めたりしない
# - 公開リポジトリのため、Secret を守る対策をしている
#   - 外部アクションはタグではなくコミット SHA で固定する（タグの差し替えで別のコードが動くのを防ぐ）。更新するときは SHA とコメントのバージョンを両方変える
#   - pull_request_target は使わない。フォークからの PR には Secret を渡さない（GitHub の既定）うえで、ジョブもスキップする
#   - checkout は persist-credentials: false にし、トークンを作業ディレクトリに残さない
name: Unity Tests

on:
  pull_request:
    paths:
      - "unity/Assets/**"
      - "unity/Packages/**"
      - "unity/ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  push:
    branches: [main]
    paths:
      - "unity/Assets/**"
      - "unity/Packages/**"
      - "unity/ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write   # テスト結果をチェックとして表示するため

jobs:
  editmode:
    name: Compile & EditMode tests
    # フォークからの PR では実行しない
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        id: license
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity ライセンスの Secret（UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD）が未登録のため、コンパイルとテストをスキップしました。README の「CI（GitHub Actions）」を参照してください。"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.license.outputs.available == 'true'
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.license.outputs.available == 'true'
        with:
          path: unity/Library
          key: Library-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**/*.meta') }}
          restore-keys: |
            Library-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-
            Library-

      - name: Run EditMode tests
        id: tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        with:
          projectPath: unity
          testMode: EditMode
          customParameters: -assemblyNames AdvancedGears.Tests.EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.license.outputs.available == 'true'
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
